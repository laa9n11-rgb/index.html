<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metro Market 1337</title>
    <style>
        /* Стили на 100% */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f0f; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h1 { margin-top: 10px; margin-bottom: 30px; color: #00ff66; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,255,102,0.4); text-align: center; font-size: 28px; }
        
        .shop-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
        
        .product-card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s, border-color 0.2s; }
        .product-card:hover { border-color: #00ff66; transform: translateY(-3px); }
        
        .product-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #eaeaea; }
        .product-price { color: #00ff66; font-size: 22px; font-weight: 900; margin-bottom: 15px; text-shadow: 0 0 8px rgba(0,255,102,0.2); }
        
        .btn { background: linear-gradient(45deg, #00ff66, #00cc55); color: #000; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s; text-transform: uppercase; }
        .btn:active { transform: scale(0.97); }
        .btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(0,255,102,0.4); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: #161616; border: 2px solid #00ff66; padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 0 30px rgba(0,255,102,0.15); animation: popIn 0.3s ease-out; }
        
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal h3 { margin-bottom: 20px; color: #00ff66; text-align: center; font-size: 22px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; background: #222; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 16px; transition: border-color 0.2s; }
        input:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 8px rgba(0,255,102,0.2); }
        
        .close-btn { background: #333; color: #fff; margin-top: 10px; box-shadow: none; }
        .close-btn:hover { background: #444; opacity: 1; box-shadow: none; }
        .close-btn:hover { background: #444; opacity: 1; }

    /* Вставляй сюда: */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .product-card {
        animation: fadeIn 0.8s ease-in;
    }
.product-card {
    transition: transform 0.3s ease;
}

.product-card:hover {
    transform: scale(1.05); /* Увеличивается на 5% */
}
        body {
    background-color: #050505; /* Очень темный фон */
    background-image: 
        linear-gradient(rgba(0, 255, 102, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.1) 1px, transparent 1px);
    background-size: 40px 40px; /* Сетка "неонового дождя" */
    animation: rainMove 20s linear infinite;
}

@keyframes rainMove {
    from { background-position: 0 0; }
    to { background-position: 0 1000px; }
}
    </style>
</head>
<body>

    <h1>Metro Market 1337</h1>

    <div class="shop-container">
        <div class="product-card">
            <div class="product-title">сопровождение (Базовый)</div>
            <div class="product-price">500 ₴</div>
            <button class="btn    .close-btn:hover { background: #444; opacity: 1; }

                " onclick="openOrder('сопровождение (500 ₴)')">Купить</button>
        </div>

        <div class="product-card">
            <div class="product-title">фулл 6 (Премиум)</div>
            <div class="product-price">120 ₴</div>
            <button class="btn" onclick="openOrder('фулл 6 (120 ₴)')">Купить</button>
        </div>
        
        <div class="product-card">
            <div class="product-title">фулл 6 ст +мк вк (VIP Доступ)</div>
            <div class="product-price">150 ₴</div>
            <button class="btn" onclick="openOrder('фулл 6 ст +мк вк (150 ₴)')">Купить</button>
        </div>
    </div>
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 id="modalTitle">Оформление заказа</h3>
            <input type="text" id="telegramNick" placeholder="@свой ник тг" required>
            <button class="btn" onclick="sendOrder()">Отправить заказ</button>
            <button class="btn close-btn" onclick="closeOrder()">Отмена</button>
        </div>
    </div>

    <script>
        let currentProduct = '';
        
  const BOT_TOKEN = '8950058290:AAEkuKpO8xDQ_BYj6UJ-JJIbdamvfvx_cdw';
const CHAT_ID = '6120501276';

        function openOrder(productInfo) {
            currentProduct = productInfo;
            document.getElementById('modalTitle').innerText = 'Заказ: ' + productInfo;
            document.getElementById('orderModal').style.display = 'flex';
        }
        function closeOrder() {
            document.getElementById('orderModal').style.display = 'none';
            document.getElementById('telegramNick').value = ''; // Очищаем поле ввода
        }

        function sendOrder() {
            const tgNick = document.getElementById('telegramNick').value.trim();
            
            // Проверка: ник должен начинаться с @ и быть длиннее 3 символов
            if(!tgNick.startsWith('@') || tgNick.length < 4) {
                alert('⚠️ Пожалуйста, введи ник в формате @username');
                return;
            }

            const text = `🛒 Новый заказ!\n📦 Товар: ${currentProduct}\n👤 Покупатель: ${tgNick}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;

            fetch(url)
            .then(response => {
                if(response.ok) {
                    alert('✅ Заказ успешно отправлен!');
                    closeOrder();
                } else {
                    alert('❌ Ошибка отправки. Проверь токен и Chat ID.');
                }
            })
            .catch(err => {
                alert('❌ Ошибка сети.');
            });
                }
    </script>
</body>
</html>
